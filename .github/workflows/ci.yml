name: CI — Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ─── Backend tests ─────────────────────────────────────────────────────────
  backend:
    name: 🐍 Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_droneview
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: 🔍 Lint (ruff)
        run: uv run ruff check .

      - name: 🔒 Security scan (bandit)
        run: uv run bandit -r blog/ django_blog/ -ll

      - name: ✅ Run tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-real
          DJANGO_DEBUG: "True"
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_droneview
        run: uv run pytest --tb=short -q

      - name: 📦 Check migrations are up to date
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-real
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_droneview
        run: uv run python manage.py migrate --check

  # ─── Frontend build ────────────────────────────────────────────────────────
  frontend:
    name: ⚛️ React Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: cd frontend && npm ci

      - name: 🔍 Lint (ESLint)
        run: cd frontend && npm run lint

      - name: 🏗️ Build
        run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Docker build (jen na main) ────────────────────────────────────────────
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
