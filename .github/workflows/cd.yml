name: CD — Deploy to Production

on:
  # Pouze ruční spuštění nebo přes tag (ne automaticky na každý push)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Prostředí pro deploy'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]
  push:
    tags: ['v*']   # deploy na tag v1.0.0, v2.3.1 atd.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔐 SSH deploy na server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/droneview
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-deps backend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            docker image prune -f

      - name: ✅ Health check
        run: |
          sleep 10
          curl -f https://${{ secrets.DEPLOY_HOST }}/api/posts/ || exit 1

      - name: 📢 Slack notifikace
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Deploy ${{ github.ref_name }} — ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
