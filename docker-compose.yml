services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: droneview
      POSTGRES_USER: droneuser
      POSTGRES_PASSWORD: dronepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d droneview"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Django Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: "super-secret-change-in-production-xyz-123"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1 backend"
      DATABASE_URL: "postgresql://droneuser:dronepass@db:5432/droneview"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173 http://localhost:80 http://frontend"
    volumes:
      - media_data:/app/media
      - .:/app           # live reload v dev módu
    ports:
      - "8555:8555"

  # ─── React Frontend (dev) ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules   # isolate node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  media_data:
