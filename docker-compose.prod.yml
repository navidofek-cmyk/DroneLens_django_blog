services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: droneview
      POSTGRES_USER: droneuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U droneuser -d droneview"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DOMAIN} backend"
      DATABASE_URL: "postgresql://droneuser:${DB_PASSWORD}@db:5432/droneview"
      CORS_ALLOWED_ORIGINS: "http://${DOMAIN} https://${DOMAIN}"
    volumes:
      - media_data:/app/media
    expose:
      - "8555"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  media_data:
